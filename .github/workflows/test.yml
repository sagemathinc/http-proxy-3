name: Build package and run tests

# newer commits in the same PR abort running ones for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version:
          - "20"
          - "22"
          - "24"

    steps:
      - uses: actions/checkout@v7

      - name: pnpm toolchain Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install -g pnpm@11.9.0
      - run: pnpm install --frozen-lockfile

      - name: Test runtime Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm run build
      - name: Test native HTTP code path
        run: npm run test-native
      - name: Test fetch HTTP code path
        run: npm run test-fetch
